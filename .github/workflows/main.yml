name: Build macOS Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller tkinterdnd2

      - name: Build .app with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "app_icon.png:." --collect-all tkinterdnd2 app.py

      - name: Create .dmg
        run: |
          brew install create-dmg
          create-dmg --volname "MiCO File Converter" --window-size 800 400 --app-drop-link 600 185 "MiCO_Setup.dmg" "dist/app.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiCO-macOS-Installer
          path: MiCO_Setup.dmg
