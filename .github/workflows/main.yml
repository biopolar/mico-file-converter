name: Build macOS Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview pymupdf python-pptx pypdf pillow pdf2docx python-docx openpyxl
          brew install create-dmg

      - name: Build App with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon="app_icon.ico" --add-data "web:web" --add-data "modules:modules" --add-data "app_icon.ico:." app.py

      - name: Create DMG Package
        run: |
          create-dmg \
            --volname "MiCO File Converter" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "dist/MiCO_Setup.dmg" \
            "dist/app.app" || hdiutil create -volname "MiCO File Converter" -srcfolder "dist/app.app" -ov -format UDZO "dist/MiCO_Setup.dmg"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: MiCO-macOS-Installer
          path: dist/*.dmg